<mat-card class="xros-card funnel-card">
  <div class="funnel-header">
    <span class="funnel-tag">FLOW FUNNEL</span>
    <div class="funnel-title">Visitor to sales and loyalty flow</div>
  </div>

  <div class="funnel-stack">
    <div class="funnel-stage" *ngFor="let s of stages" [style.width.%]="s.widthPct">
      <div class="funnel-stage-shape" [style.background]="s.color"></div>
      <div class="funnel-stage-content">
        <span class="stage-label">{{ s.label }}</span>
        <span class="stage-value-row">
          <span class="stage-value">{{ s.value | number }}</span>
          <span class="stage-secondary" *ngIf="s.secondaryLabel">{{ s.secondaryLabel }}</span>
        </span>
        <span class="stage-description" *ngIf="s.description">{{ s.description }}</span>
      </div>
    </div>
  </div>
</mat-card>
