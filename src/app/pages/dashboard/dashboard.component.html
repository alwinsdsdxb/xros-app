
<div class="dashboard-page">
  <div class="page-tab-bar">
    <button
      *ngFor="let tab of pageTabs"
      type="button"
      class="page-tab"
      [class.active]="activeTab === tab.value"
      [class.disabled]="!tab.enabled"
      (click)="selectTab(tab)"
    >
      {{ tab.label }}
    </button>
  </div>

  <ng-container *ngIf="activeTab === 'dashboard'">
  <mat-card class="xros-card filter-bar" [formGroup]="filterForm">
    <div class="filter-box" *ngIf="dashboards.length > 1">
      <span class="filter-caption">Dashboard</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-field dashboard-field">
        <mat-select [value]="currentDashboardId" (selectionChange)="onDashboardChange($event.value)">
          <mat-option *ngFor="let d of dashboards" [value]="d._id">{{ d.dashboardName }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="filter-box">
      <span class="filter-caption">Scope</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-field scope-field">
        <mat-select formControlName="scope">
          <mat-option *ngFor="let s of scopes" [value]="s.value">{{ s.label }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="filter-box">
      <span class="filter-caption">View</span>
      <mat-button-toggle-group formControlName="view" class="view-toggle">
        <mat-button-toggle *ngFor="let v of views" [value]="v">{{ v }}</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <div class="filter-box" *ngIf="filterForm.value.view !== 'Custom'">
      <span class="filter-caption">Date</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-field date-field">
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="filter-box" *ngIf="filterForm.value.view === 'Custom'" [formGroup]="customRangeGroup">
      <span class="filter-caption">Date Range</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-field date-field date-range-field">
        <mat-date-range-input [rangePicker]="rangePicker">
          <input matStartDate formControlName="start" placeholder="Start" />
          <input matEndDate formControlName="end" placeholder="End" />
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="rangePicker"></mat-datepicker-toggle>
        <mat-date-range-picker #rangePicker></mat-date-range-picker>
      </mat-form-field>
    </div>

    <div class="filter-box">
      <span class="filter-caption">Hours</span>
      <mat-button-toggle-group formControlName="operationalHours" class="hours-toggle">
        <mat-button-toggle *ngFor="let h of hoursOptions" [value]="h.value">{{ h.label }}</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <button mat-flat-button color="primary" class="apply-btn" (click)="apply()" [disabled]="loading">
      Apply
    </button>
  </mat-card>

  <div class="loading-row" *ngIf="loading">
    <mat-progress-spinner mode="indeterminate" diameter="26"></mat-progress-spinner>
    <span>Loading total footfall...</span>
  </div>

  <app-active-campaigns-panel
    [campaigns]="campaignsForPanel"
    [rangeFrom]="campaignsRangeFrom"
    [rangeTo]="campaignsRangeTo"
  ></app-active-campaigns-panel>

  <div class="dashboard-container">
    <div class="dashboard-tag-row">
      <span class="section-tag">DASHBOARD</span>
      <div class="dashboard-date-badge">
        <div class="badge-date">{{ displayDate }}</div>
      </div>
    </div>

    <div class="kpi-funnel-row">
      <div class="kpi-col">
        <div class="kpi-row">
          <app-kpi-card
            label="Passer By"
            icon="directions_walk"
            description="Consolidated storefront traffic"
            [date]="displayDate"
            [metric]="passerByMetric"
            [view]="filterForm.value.view"
          ></app-kpi-card>
          <app-kpi-card
            label="Total Footfall"
            icon="groups"
            description="Sensor traffic count"
            [date]="displayDate"
            [metric]="footfallMetric"
            [view]="filterForm.value.view"
          ></app-kpi-card>
          <app-kpi-card
            label="Unique Footfall"
            icon="person_pin_circle"
            description="Deduplicated visitors"
            [date]="displayDate"
            [metric]="uniqueFootfallMetric"
            [view]="filterForm.value.view"
          ></app-kpi-card>
          <app-kpi-card
            label="Groups"
            icon="group"
            description="Consolidated grouped visits"
            [date]="displayDate"
            [metric]="groupsMetric"
            [view]="filterForm.value.view"
          ></app-kpi-card>
        </div>
      </div>

      <div class="funnel-col">
        <app-flow-funnel-chart [funnelData]="funnelStages"></app-flow-funnel-chart>
      </div>
    </div>

    <app-trend-chart [series]="trafficSeriesForChart"></app-trend-chart>

    <app-demographics-panel [demographics]="demographicsForPanel"></app-demographics-panel>

    <app-dwell-panel [dwell]="dwellForPanel" [view]="filterForm.value.view"></app-dwell-panel>

    <app-operations-panel [operations]="operationsForPanel"></app-operations-panel>
  </div>
  </ng-container>

  <app-instore-analytics
    *ngIf="visitedTabs.has('instore')"
    [hidden]="activeTab !== 'instore'"
    [dashboardId]="currentDashboardId"
    [dashboards]="dashboards"
    (dashboardChange)="onDashboardChange($event)"
  ></app-instore-analytics>

  <app-calendar-panel
    *ngIf="visitedTabs.has('calendar')"
    [hidden]="activeTab !== 'calendar'"
    [dashboardId]="currentDashboardId"
    [dashboards]="dashboards"
    (dashboardChange)="onDashboardChange($event)"
  ></app-calendar-panel>

  <app-forecast-panel *ngIf="visitedTabs.has('forecast')" [hidden]="activeTab !== 'forecast'"></app-forecast-panel>

  <app-comparison-panel
    *ngIf="visitedTabs.has('comparison')"
    [hidden]="activeTab !== 'comparison'"
    [dashboardId]="currentDashboardId"
    [dashboards]="dashboards"
    (dashboardChange)="onDashboardChange($event)"
  ></app-comparison-panel>
</div>
