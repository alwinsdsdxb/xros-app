name: XROS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only validate that the application builds for pull requests.
      # Production builds happen on the server.
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Build check
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Prepare SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd /var/www/xros-app

             git pull origin main

             npm ci

             npm run build

             BACKUP=/var/www/html_backup_\$(date +%Y%m%d_%H%M%S)
             cp -a /var/www/html \"\$BACKUP\"

             rm -rf /var/www/html/*
             cp -a dist/app_v2/browser/. /var/www/html/
            "